<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H hub 手机连接</title><link rel="stylesheet" href="/style.css"></head><body><main><header><b>H hub</b><span id="connection">连接电脑</span></header><section id="pair"><h1>连接你的电脑</h1><p>手机与电脑处在可互访的局域网。输入电脑显示的配对码，再在电脑端批准。</p><label>设备名称<input id="name" maxlength="64" value="我的手机" autocomplete="off"></label><label>配对码<input id="code" inputmode="numeric" maxlength="6" autocomplete="off"></label><button id="connect">申请配对</button></section><section id="dashboard" hidden><h1 id="device"></h1><div id="metrics" class="metrics"></div><h2>外设</h2><div id="peripherals"></div><h2>场景</h2><p>场景会提交设备配置应用请求，实际生效以电脑插件回读确认状态为准。</p><div id="scenes"></div><h2>通用 EQ</h2><p>调节电脑上已保存的应用 EQ，可启动或停止音频链路。首次路由配置请在电脑端完成。</p><div id="eq"></div></section><p id="message" role="status"></p><footer>HTTPS 局域网连接 · 授权可在电脑端撤销</footer></main><script src="/app.js"></script></body></html>
