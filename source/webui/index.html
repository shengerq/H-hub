<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://assets.hhub.local data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>H hub 首页</title>
  <link rel="stylesheet" href="home.css">
  <script src="home.js" defer></script>
</head>
<body>
<main aria-label="首页">
  <header class="system-heading">
    <button class="section-link" data-action="system">系统状态 <span aria-hidden="true">›</span></button>
    <span class="muted caption">实时硬件概览 · 每 2 秒刷新</span>
  </header>
  <section id="metrics" aria-label="实时系统状态"></section>
  <header class="devices-heading">
    <h1>我的设备</h1>
    <div class="actions">
      <span class="muted caption" id="device-count">读取中…</span>
      <button data-action="overview">设备概览</button>
      <button data-action="interfaces">全部接口</button>
      <button data-action="refresh" id="refresh">刷新设备</button>
    </div>
  </header>
  <section id="device-area" aria-label="设备概览">
    <article class="card hero" id="hero">
      <div id="device-info">
        <div class="type-row"><span class="badge">当前设备</span><span class="muted caption" id="device-kind"></span></div>
        <div class="device-title"><h2 id="device-name">正在读取设备…</h2><button data-action="details">设备详情 <span aria-hidden="true">›</span></button></div>
        <div class="connection"><span id="connection-dot" aria-hidden="true">●</span><span id="device-status"></span><span class="muted caption" id="device-battery"></span></div>
        <p class="muted caption" id="device-profile"></p>
      </div>
      <figure id="device-art"><img id="hero-image" alt="当前设备外观"><figcaption class="muted" id="art-note"></figcaption></figure>
      <p id="empty" class="muted" hidden>未发现连接的外设。点击“全部接口”查看所有接口。</p>
    </article>
    <aside class="shelf">
      <div id="device-list" aria-label="已有设备列表"></div>
      <footer class="muted caption" id="scene"></footer>
    </aside>
  </section>
  <p id="load-status" role="status" class="muted" hidden></p>
</main>
</body>
</html>
